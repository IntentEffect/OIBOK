<text x="449.00" y="364.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Current policy + clearer authority +</text>
<text x="449.00" y="387.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">accepted handoffs + draft assistance.</text>
<text x="449.00" y="410.85" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Permissions, review, fallback and</text>
<text x="449.00" y="433.80" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">conditions for the pilot.</text>
