<rect x="44" y="595" width="1112" height="100" rx="0" fill="#e6eef0" stroke="#c9cec5" stroke-width="1"/>
<text x="63.00" y="628.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700">Keep status and evidence visible</text>
<text x="63.00" y="660.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Adapt and extend only after corrections, retesting and confirmed named reviewers. Actions are not recorded complete. The week-eight</text>
<text x="63.00" y="684.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">persistence check is pending.</text>
<text x="44.00" y="732.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Records can develop together. Reuse suitable existing records. Non-AI work can bypass the AI canvas.</text>
<text x="44.00" y="754.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400">The receiving owner checks usable evidence, permitted next action and unresolved conditions.</text>
