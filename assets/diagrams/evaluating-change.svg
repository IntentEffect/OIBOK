<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 848" width="1200" height="848" role="img" aria-labelledby="title desc"><title id="title">Evaluating the change and AI contribution</title><desc id="desc">Compare complete working arrangements and keep alternative explanations visible. Source: OIBOK 1.0 · Guide 0.3 · Research chapters 7, 10 · oibok.org/diagrams/evaluating-change/ Draft for practitioner review. CC BY-SA 4.0.</desc>
<rect x="0" y="0" width="1200" height="848" rx="0" fill="#f6f5f0" stroke="none" stroke-width="1"/>
<text x="44.00" y="48.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700">OIBOK</text>
<text x="909.32" y="44.00" fill="#a3412c" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700">DRAFT 0.1  /  FOR PRACTITIONER REVIEW</text>
<text x="44.00" y="105.00" fill="#232b2a" font-family="Liberation Serif, Georgia, serif" font-size="36" font-weight="400">Evaluating the change and AI contribution</text>
<text x="44.00" y="131.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Compare complete working arrangements and keep alternative explanations visible.</text>
<polyline points="44,158 1156,158" fill="none" stroke="#c9cec5" stroke-width="1"/>
<polyline points="44,764 1156,764" fill="none" stroke="#c9cec5" stroke-width="1"/>
<text x="44.00" y="791.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="400">Evaluation aid · Visual set 0.1 · 23 November 2026</text>
<text x="963.26" y="791.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="400">oibok.org/diagrams/ · CC BY-SA 4.0</text>
<text x="44.00" y="812.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400">Source: OIBOK 1.0 · Guide 0.3 · Research chapters 7, 10 · oibok.org/diagrams/evaluating-change/</text>
<rect x="44" y="175" width="352" height="154" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="61.00" y="211.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">A Current practice</text>
<text x="61.00" y="238.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Record the existing sources, roles and</text>
<text x="61.00" y="260.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">workflow. Preserve the baseline and its</text>
<text x="61.00" y="283.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">limits.</text>
<polyline points="220,329 220,357" fill="none" stroke="#5b6461" stroke-width="1.7"/>
<polygon points="220,357 223.6,349.0 216.4,349.0" fill="#5b6461"/>
<rect x="424" y="175" width="352" height="154" rx="0" fill="#e7ece3" stroke="#c9cec5" stroke-width="1"/>
<text x="441.00" y="211.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">B Improved work</text>
<text x="441.00" y="238.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Define a credible change without AI:</text>
<text x="441.00" y="260.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">knowledge, authority, handoffs and</text>
<text x="441.00" y="283.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">support.</text>
<polyline points="600,329 600,357" fill="none" stroke="#5b6461" stroke-width="1.7"/>
<polygon points="600,357 603.6,349.0 596.4,349.0" fill="#5b6461"/>
<rect x="804" y="175" width="352" height="154" rx="0" fill="#e6eef0" stroke="#c9cec5" stroke-width="1"/>
<text x="821.00" y="211.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">C Same work with AI</text>
<text x="821.00" y="238.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Add a specified AI contribution. Keep the</text>
<text x="821.00" y="260.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">other changes comparable and record</text>
<text x="821.00" y="283.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">differences.</text>
<polyline points="980,329 980,357" fill="none" stroke="#5b6461" stroke-width="1.7"/>
<polygon points="980,357 983.6,349.0 976.4,349.0" fill="#5b6461"/>
<rect x="44" y="357" width="1112" height="90" rx="0" fill="#f6f5f0" stroke="#c9cec5" stroke-width="1"/>
<text x="61.00" y="394.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700">Use shared definitions, eligible cases and follow-up</text>
<text x="61.00" y="421.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Outcomes for affected people, quality, total human effort, safeguards and whether the intended change was used.</text>
<rect x="44" y="473" width="542" height="108" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="61.00" y="510.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700">A versus C: the whole package</text>
<text x="61.00" y="537.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Can inform the combined change. AI's separate contribution</text>
<text x="61.00" y="559.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">remains unresolved in this comparison.</text>
<rect x="614" y="473" width="542" height="108" rx="0" fill="#e6eef0" stroke="#c9cec5" stroke-width="1"/>
<text x="631.00" y="510.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700">B versus C: additional AI contribution</text>
<text x="631.00" y="537.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Compare the same improved arrangement with and without AI.</text>
<text x="631.00" y="559.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Record any other material differences.</text>
<rect x="44" y="607" width="1112" height="87" rx="0" fill="#e7ece3" stroke="#c9cec5" stroke-width="1"/>
<text x="61.00" y="644.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700">Keep competing explanations visible</text>
<text x="61.00" y="671.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Check case mix, workload, experience, extra support, concurrent changes and changes in measurement.</text>
<text x="44.00" y="730.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400">Comparisons alone do not establish causality. The design, implementation and evidence determine the strength of the conclusion.</text>
</svg>
