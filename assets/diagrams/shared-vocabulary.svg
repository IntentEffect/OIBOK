<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 848" width="1200" height="848" role="img" aria-labelledby="title desc"><title id="title">A shared vocabulary for one workflow</title><desc id="desc">An illustrative relationship map connecting evidence, policy, expertise, authority, decisions and action. Source: OIBOK 1.0 · Guide 0.3 · Research chapters 2, 3, 4 · oibok.org/diagrams/shared-vocabulary/ Draft for practitioner review. CC BY-SA 4.0.</desc>
