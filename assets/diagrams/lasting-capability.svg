<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 848" width="1200" height="848" role="img" aria-labelledby="title desc"><title id="title">From a lesson to lasting capability</title><desc id="desc">Connect evaluated experience to changed work and later evidence of usable organisational capability. Source: OIBOK 1.0 · Guide 0.3 · Research chapters 8, 9, 10 · oibok.org/diagrams/lasting-capability/ Draft for practitioner review. CC BY-SA 4.0.</desc>
<rect x="0" y="0" width="1200" height="848" rx="0" fill="#f6f5f0" stroke="none" stroke-width="1"/>
<text x="44.00" y="48.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700">OIBOK</text>
<text x="909.32" y="44.00" fill="#a3412c" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700">DRAFT 0.1  /  FOR PRACTITIONER REVIEW</text>
<text x="44.00" y="105.00" fill="#232b2a" font-family="Liberation Serif, Georgia, serif" font-size="36" font-weight="400">From a lesson to lasting capability</text>
<text x="44.00" y="131.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Connect evaluated experience to changed work and later evidence of usable organisational capability.</text>
<polyline points="44,158 1156,158" fill="none" stroke="#c9cec5" stroke-width="1"/>
<polyline points="44,764 1156,764" fill="none" stroke="#c9cec5" stroke-width="1"/>
<text x="44.00" y="791.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="400">Learning and persistence aid · Visual set 0.1 · 23 November 2026</text>
<text x="963.26" y="791.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="400">oibok.org/diagrams/ · CC BY-SA 4.0</text>
<text x="44.00" y="812.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="400">Source: OIBOK 1.0 · Guide 0.3 · Research chapters 8, 9, 10 · oibok.org/diagrams/lasting-capability/</text>
<rect x="44" y="175" width="1112" height="73" rx="0" fill="#e7ece3" stroke="#c9cec5" stroke-width="1"/>
<text x="57.00" y="207.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Maintain usable organisational memory throughout</text>
<text x="57.00" y="233.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Keep sources, scope, ownership, versions and supersession available at each step.</text>
<rect x="70" y="276" width="300" height="124" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="87.00" y="312.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Evaluate experience</text>
<text x="87.00" y="338.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Preserve observations, uncertainty</text>
<text x="87.00" y="359.60" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">and competing explanations.</text>
<rect x="450" y="276" width="300" height="124" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="467.00" y="312.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Form a conditional lesson</text>
<text x="467.00" y="338.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">State where it applies, its limits and</text>
<text x="467.00" y="359.60" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">what would reopen it.</text>
<rect x="830" y="276" width="300" height="124" rx="0" fill="#e6eef0" stroke="#c9cec5" stroke-width="1"/>
<text x="847.00" y="312.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Change the work</text>
<text x="847.00" y="338.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Assign owners for changes to</text>
<text x="847.00" y="359.60" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">guidance, authority, handoffs, skills</text>
<text x="847.00" y="381.20" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">or systems.</text>
<rect x="830" y="448" width="300" height="124" rx="0" fill="#e6eef0" stroke="#c9cec5" stroke-width="1"/>
<text x="847.00" y="484.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Use it in later work</text>
<text x="847.00" y="510.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Observe a later case and its</text>
<text x="847.00" y="531.60" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">consequences under the stated</text>
<text x="847.00" y="553.20" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">conditions.</text>
<rect x="450" y="448" width="300" height="124" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="467.00" y="484.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Review continuity</text>
<text x="467.00" y="510.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Check what remains usable, what</text>
<text x="467.00" y="531.60" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">changed and what is still untested.</text>
<rect x="70" y="448" width="300" height="124" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="87.00" y="484.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Retain, revise or retire</text>
<text x="87.00" y="510.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Record the evidence, authorised</text>
<text x="87.00" y="531.60" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">decision, scope and next review.</text>
<polyline points="370,338 450,338" fill="none" stroke="#a3412c" stroke-width="1.7"/>
<polygon points="450,338 442.0,334.4 442.0,341.6" fill="#a3412c"/>
<polyline points="750,338 830,338" fill="none" stroke="#a3412c" stroke-width="1.7"/>
<polygon points="830,338 822.0,334.4 822.0,341.6" fill="#a3412c"/>
<polyline points="980,400 980,448" fill="none" stroke="#a3412c" stroke-width="1.7"/>
<polygon points="980,448 983.6,440.0 976.4,440.0" fill="#a3412c"/>
<polyline points="830,510 750,510" fill="none" stroke="#a3412c" stroke-width="1.7"/>
<polygon points="750,510 758.0,513.6 758.0,506.4" fill="#a3412c"/>
<polyline points="450,510 370,510" fill="none" stroke="#a3412c" stroke-width="1.7"/>
<polygon points="370,510 378.0,513.6 378.0,506.4" fill="#a3412c"/>
<polyline points="70,510 52,510 52,338 70,338" fill="none" stroke="#a3412c" stroke-width="1.7"/>
<polygon points="70,338 62.0,334.4 62.0,341.6" fill="#a3412c"/>
<text x="44.00" y="607.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700">Three checks of later use</text>
<text x="747.43" y="606.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400">Completed actions and planned checks need distinct records.</text>
<rect x="44" y="621" width="352" height="110" rx="0" fill="#f6f5f0" stroke="#c9cec5" stroke-width="1"/>
<text x="61.00" y="657.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Reuse</text>
<text x="61.00" y="683.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Can a later case use current guidance and</text>
<text x="61.00" y="704.60" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">recognise exceptions?</text>
<rect x="424" y="621" width="352" height="110" rx="0" fill="#f6f5f0" stroke="#c9cec5" stroke-width="1"/>
<text x="441.00" y="657.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Succession</text>
<text x="441.00" y="683.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Can another prepared person act within</text>
<text x="441.00" y="704.60" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">authority without hidden help?</text>
<rect x="804" y="621" width="352" height="110" rx="0" fill="#f6f5f0" stroke="#c9cec5" stroke-width="1"/>
<text x="821.00" y="657.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Changed conditions</text>
<text x="821.00" y="683.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Can the arrangement adapt or fall back</text>
<text x="821.00" y="704.60" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">within its agreed bounds?</text>
</svg>
