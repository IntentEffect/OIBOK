<text x="44.00" y="209.00" fill="#a3412c" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700">SOURCE</text>
<text x="44.00" y="230.00" fill="#a3412c" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700">OWNERSHIP</text>
<text x="44.00" y="347.00" fill="#a3412c" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700">AI</text>
<text x="44.00" y="368.00" fill="#a3412c" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700">ASSISTANCE</text>
<text x="44.00" y="485.00" fill="#a3412c" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700">REVIEW AND</text>
<text x="44.00" y="506.00" fill="#a3412c" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700">AUTHORITY</text>
<text x="44.00" y="623.00" fill="#a3412c" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700">ACTION AND</text>
<text x="44.00" y="644.00" fill="#a3412c" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700">EVIDENCE</text>
<polyline points="370,295 370,321" fill="none" stroke="#a3412c" stroke-width="1.7"/>
