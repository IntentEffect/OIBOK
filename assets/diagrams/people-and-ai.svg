<text x="558.00" y="347.00" fill="#406e7c" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400">Missing or conflicting policy</text>
<text x="583.00" y="397.00" fill="#406e7c" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400">Abstain from the proposed response</text>
<polyline points="490,433 490,444 850,444 850,515 870,515" fill="none" stroke="#406e7c" stroke-width="1.7" stroke-dasharray="5 4"/>
<polygon points="870,515 862.0,511.4 862.0,518.6" fill="#406e7c"/>
<text x="584.00" y="433.00" fill="#406e7c" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400">Unavailable or unreliable</text>
<rect x="230" y="183" width="280" height="112" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="243.00" y="215.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Approved sources</text>
<text x="243.00" y="243.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Current policy and version.</text>
<text x="243.00" y="267.30" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Owner and scope recorded.</text>
<rect x="550" y="183" width="606" height="112" rx="0" fill="#e7ece3" stroke="#c9cec5" stroke-width="1"/>
<text x="563.00" y="215.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Meaningful review</text>
<text x="563.00" y="243.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Evidence, expertise, time and authority to reject or stop.</text>
<text x="563.00" y="267.30" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Read access and permission to act are separate.</text>
<rect x="230" y="321" width="280" height="112" rx="0" fill="#e6eef0" stroke="#c9cec5" stroke-width="1"/>
<text x="243.00" y="353.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Retrieve and draft</text>
<text x="243.00" y="381.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Source-linked draft.</text>
<text x="243.00" y="405.30" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">No external action.</text>
<rect x="870" y="321" width="286" height="112" rx="0" fill="#e6eef0" stroke="#c9cec5" stroke-width="1"/>
<text x="883.00" y="353.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Abstain and escalate</text>
<text x="883.00" y="381.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Supervisor resolves the issue.</text>
<text x="883.00" y="405.30" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Route excluded cases onward.</text>
<rect x="230" y="459" width="280" height="112" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="243.00" y="491.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Review the response</text>
<text x="243.00" y="519.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Check sources and claims.</text>
<text x="243.00" y="543.30" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Correct, reject or escalate.</text>
<rect x="550" y="459" width="280" height="112" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="563.00" y="491.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Decide within authority</text>
<text x="563.00" y="519.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Named person decides within</text>
<text x="563.00" y="543.30" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">recorded authority.</text>
<rect x="870" y="459" width="286" height="112" rx="0" fill="#e6eef0" stroke="#c9cec5" stroke-width="1"/>
<text x="883.00" y="491.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Manual fallback</text>
<text x="883.00" y="519.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Prepared staff resume from</text>
<text x="883.00" y="543.30" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">recorded state with capacity.</text>
<rect x="230" y="597" width="280" height="112" rx="0" fill="#e7ece3" stroke="#c9cec5" stroke-width="1"/>
<text x="243.00" y="629.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">AI limits in this case</text>
<text x="243.00" y="657.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">No sending, refunds, policy</text>
<text x="243.00" y="681.30" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">changes or external actions.</text>
<rect x="550" y="597" width="280" height="112" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="563.00" y="629.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Adviser sends reply</text>
<text x="563.00" y="657.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Adviser approves the reply.</text>
<text x="563.00" y="681.30" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Preserve rationale and state.</text>
<rect x="870" y="597" width="286" height="112" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="883.00" y="629.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Observe consequences</text>
<text x="883.00" y="657.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Resolution, quality and effort.</text>
<text x="883.00" y="681.30" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400">Later repeat contact.</text>
<text x="230.00" y="747.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400">Record the configuration and permissions tested. Review and fallback arrangements require evidence before live use.</text>
</svg>
