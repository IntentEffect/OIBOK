<text x="64.00" y="363.00" fill="#406e7c" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400">Evidence may reopen the question.</text>
<polyline points="980,575 980,549 600,549 600,527" fill="none" stroke="#406e7c" stroke-width="1.7" stroke-dasharray="5 4"/>
<polygon points="600,527 596.4,535.0 603.6,535.0" fill="#406e7c"/>
<text x="691.00" y="544.00" fill="#406e7c" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400">Revisit design or evaluation</text>
<rect x="64" y="205" width="312" height="137" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="80.00" y="240.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Define one inquiry</text>
<text x="80.00" y="267.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Practice Review.</text>
<text x="80.00" y="289.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Outcome, boundary and owner.</text>
<text x="80.00" y="312.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Contrasting cases and sources.</text>
<rect x="444" y="205" width="312" height="137" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="460.00" y="240.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Investigate actual work</text>
<text x="460.00" y="267.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Cases, meanings and evidence.</text>
<text x="460.00" y="289.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Context and Knowledge Map.</text>
<text x="460.00" y="312.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Decision and Coordination Canvas.</text>
<rect x="824" y="205" width="312" height="137" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="840.00" y="240.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Compare credible options</text>
<text x="840.00" y="267.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Current practice.</text>
<text x="840.00" y="289.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Improvement without AI.</text>
<text x="840.00" y="312.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">AI with a contribution to test.</text>
<rect x="824" y="390" width="312" height="137" rx="0" fill="#e6eef0" stroke="#c9cec5" stroke-width="1"/>
<text x="840.00" y="425.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Design the AI contribution</text>
<text x="840.00" y="452.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Task, permissions and fallback.</text>
<text x="840.00" y="474.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">AI Opportunity and Work</text>
<text x="840.00" y="497.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Design Canvas.</text>
<rect x="444" y="390" width="312" height="137" rx="0" fill="#e7ece3" stroke="#c9cec5" stroke-width="1"/>
<text x="460.00" y="425.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Plan change and evaluation</text>
<text x="460.00" y="452.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Work, authority and measures.</text>
<text x="460.00" y="474.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Baseline and comparison.</text>
<text x="460.00" y="497.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Outcome and Learning Record.</text>
<rect x="64" y="390" width="312" height="137" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="80.00" y="425.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Try the bounded change</text>
<text x="80.00" y="452.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Confirm authority and conditions.</text>
<text x="80.00" y="474.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Try the change within scope.</text>
<text x="80.00" y="497.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Collect the agreed evidence.</text>
<rect x="64" y="575" width="312" height="137" rx="0" fill="#e7ece3" stroke="#c9cec5" stroke-width="1"/>
<text x="80.00" y="610.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Review consequences</text>
<text x="80.00" y="637.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Continue, adapt, stop or defer.</text>
<text x="80.00" y="659.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Record what else could explain</text>
<text x="80.00" y="682.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">the result.</text>
<rect x="444" y="575" width="312" height="137" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="460.00" y="610.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Retain useful changes</text>
<text x="460.00" y="637.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Update guidance, authority,</text>
<text x="460.00" y="659.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">handoffs or resources.</text>
<text x="460.00" y="682.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Name an owner for retention.</text>
<rect x="824" y="575" width="312" height="137" rx="0" fill="#ffffff" stroke="#c9cec5" stroke-width="1"/>
<text x="840.00" y="610.00" fill="#232b2a" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700">Check later use</text>
<text x="840.00" y="637.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Reuse by a prepared colleague.</text>
<text x="840.00" y="659.95" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Check changed conditions.</text>
<text x="840.00" y="682.90" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400">Keep limits and gaps visible.</text>
<text x="64.00" y="747.00" fill="#5b6461" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400">Further inquiry or retaining current practice can be the right next decision. These activities can recur and overlap.</text>
</svg>
